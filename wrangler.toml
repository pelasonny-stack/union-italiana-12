# Config Cloudflare Workers + Static Assets para servir el sitio Astro
# (alternativa moderna a CF Pages — un Worker que solo sirve dist/)
#
# El otro wrangler.toml está en workers/petition-handler/ — ese deploya
# el Worker de petición separado. Este es solo para el sitio.

name = "logiaunionitaliana12"
compatibility_date = "2025-04-01"

# Sin copia en *.workers.dev ni URLs de vista previa: eran duplicados indexables del sitio.
# Sin esto, cada `wrangler deploy` las vuelve a prender.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "logiaunionitaliana12.com.ar", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
